# Source: happy-furn/templates/app.yaml
apiVersion: apps/v1
kind: Deployment
metadata: { name: backend }
spec:
  replicas: 1
  revisionHistoryLimit: 3
  strategy:
    type: RollingUpdate
    rollingUpdate: { maxSurge: 0, maxUnavailable: 1 }
  selector:
    matchLabels: { app: backend }
  template:
    metadata:
      labels: { app: backend }
    spec:
      automountServiceAccountToken: false
      terminationGracePeriodSeconds: 20
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        seccompProfile: { type: RuntimeDefault }
      containers:
        - name: backend
          image: "happy-furn-backend:replace-reviewed-sha"
          imagePullPolicy: IfNotPresent
          ports: [{ name: http, containerPort: 3000 }]
          resources:
            limits:
              cpu: "1"
              memory: 512Mi
            requests:
              cpu: 100m
              memory: 128Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: { drop: [ALL] }
          livenessProbe:
            httpGet: { path: /health/live, port: http }
            initialDelaySeconds: 15
            periodSeconds: 10
          readinessProbe:
            httpGet: { path: /health/ready, port: http }
            initialDelaySeconds: 5
            periodSeconds: 5
          envFrom:
            - configMapRef: { name: happy-furn-config }
            - secretRef: { name: happy-furn-secrets }
          volumeMounts:
            - { name: tmp, mountPath: /tmp }
            - { name: media, mountPath: /data/media }
      volumes:
        - name: tmp
          emptyDir: { sizeLimit: 64Mi }
        - name: media
          persistentVolumeClaim: { claimName: happy-furn-media }
