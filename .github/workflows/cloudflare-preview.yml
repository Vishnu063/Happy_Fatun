name: Manual Cloudflare preview
on:
  workflow_dispatch:
    inputs:
      reviewed_commit:
        description: Exact reviewed 40-character SHA at feat/furniture-platform HEAD
        required: true
        type: string
permissions:
  contents: read
concurrency:
  group: cloudflare-preview-deployment
  cancel-in-progress: false
jobs:
  verify:
    if: github.repository == 'Vishnu063/Happy_Fatun' && github.ref == 'refs/heads/feat/furniture-platform'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
      - name: Verify pinned dispatch and configured approval gate
        run: node scripts/check-manual-deployment.mjs
        env:
          GH_TOKEN: ${{ github.token }}
          REVIEWED_COMMIT: ${{ inputs.reviewed_commit }}
      - run: bash scripts/lint-workflows.sh
      - run: npm ci
      - run: npm run format:check
      - run: npm run preview:check
      - run: npm run build
      - run: npm test
      - run: npm audit --audit-level=moderate
      - run: node scripts/deploy.mjs --preview --dry-run
        env:
          WRANGLER_SEND_METRICS: "false"
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e -- --reporter=github,line
      - run: npm run test:e2e:preview -- --reporter=github,line
  deploy:
    needs: verify
    if: github.repository == 'Vishnu063/Happy_Fatun' && github.ref == 'refs/heads/feat/furniture-platform'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: cloudflare-preview
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
      - name: Recheck commit and approval configuration after environment gate
        run: node scripts/check-manual-deployment.mjs
        env:
          GH_TOKEN: ${{ github.token }}
          REVIEWED_COMMIT: ${{ inputs.reviewed_commit }}
      - run: npm ci
      - name: Inject and validate reviewed non-secret target identifiers
        run: node scripts/prepare-preview-target.mjs
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_D1_DATABASE_ID: ${{ vars.CLOUDFLARE_D1_DATABASE_ID }}
      - run: npm run preview:check
      - run: npm run build
      - run: node scripts/deploy.mjs --preview --dry-run
        env:
          WRANGLER_SEND_METRICS: "false"
      - name: Publish approved preview only (no migrations or secret installation)
        run: |
          if [ -z "${CLOUDFLARE_API_TOKEN:-}" ]; then
            echo "Cloudflare API token is missing; deployment blocked." >&2
            exit 1
          fi
          node scripts/deploy.mjs --preview
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_D1_DATABASE_ID: ${{ vars.CLOUDFLARE_D1_DATABASE_ID }}
          WRANGLER_SEND_METRICS: "false"
