global:
  scrape_interval: 30s
rule_files: [/etc/prometheus/happy-furn-alerts.yaml]
scrape_configs:
  - job_name: happy-furn
    metrics_path: /metrics
    static_configs:
      - targets: [backend.happy-furn-lab.svc.cluster.local:3000]
  # kube-state-metrics and kubelet/cAdvisor must be installed/configured separately.
  - job_name: kube-state-metrics
    static_configs:
      - targets: [kube-state-metrics.monitoring.svc.cluster.local:8080]
