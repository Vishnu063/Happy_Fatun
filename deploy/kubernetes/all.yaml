# Source: happy-furn/templates/postgres.yaml
apiVersion: apps/v1
kind: StatefulSet
metadata: { name: postgres }
spec:
  serviceName: postgres
  replicas: 1
  persistentVolumeClaimRetentionPolicy:
    { whenDeleted: Retain, whenScaled: Retain }
  selector: { matchLabels: { app: postgres } }
  template:
    metadata: { labels: { app: postgres } }
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 70
        runAsGroup: 70
        fsGroup: 70
        seccompProfile: { type: RuntimeDefault }
      containers:
        - name: postgres
          image: "happy-furn-postgres:replace-reviewed-sha"
          ports: [{ name: postgres, containerPort: 5432 }]
          resources:
            limits:
              cpu: 500m
              memory: 512Mi
            requests:
              cpu: 100m
              memory: 128Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: { drop: [ALL] }
          env:
            - { name: POSTGRES_USER, value: happy_furn }
            - { name: POSTGRES_DB, value: happy_furn }
            - { name: PGDATA, value: /var/lib/postgresql/data/pgdata }
            - name: POSTGRES_PASSWORD
              valueFrom:
                {
                  secretKeyRef:
                    { name: happy-furn-secrets, key: POSTGRES_PASSWORD },
                }
          readinessProbe:
            exec:
              {
                command:
                  [pg_isready, -h, 127.0.0.1, -U, happy_furn, -d, happy_furn],
              }
            initialDelaySeconds: 5
          livenessProbe:
            exec:
              {
                command:
                  [pg_isready, -h, 127.0.0.1, -U, happy_furn, -d, happy_furn],
              }
            initialDelaySeconds: 20
          volumeMounts:
            - { name: data, mountPath: /var/lib/postgresql/data }
            - { name: tmp, mountPath: /tmp }
            - { name: run, mountPath: /var/run/postgresql }
      volumes:
        - { name: tmp, emptyDir: { sizeLimit: 64Mi } }
        - { name: run, emptyDir: { sizeLimit: 16Mi } }
  volumeClaimTemplates:
    - metadata: { name: data }
      spec:
        accessModes: [ReadWriteOnce]
        resources: { requests: { storage: 5Gi } }
