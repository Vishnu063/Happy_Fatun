name: Build and verify
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run format:check
      - run: npm run deploy:check
      - run: npm run preview:check
      - run: npm run build
      - run: node scripts/deploy.mjs --preview --dry-run
        env:
          WRANGLER_SEND_METRICS: "false"
      - run: npm test
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e -- --reporter=github,line
      - run: npm run test:e2e:preview -- --reporter=github,line
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: browser-test-results
          path: test-results
          retention-days: 7
