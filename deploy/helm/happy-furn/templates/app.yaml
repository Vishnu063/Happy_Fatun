{{- if and (eq .Values.media.driver "filesystem") (gt (int .Values.backend.replicas) 1) }}
{{- fail "Filesystem lab media requires one backend replica; use shared S3 storage before scaling." }}
{{- end }}
apiVersion: v1
kind: ConfigMap
metadata: { name: happy-furn-config }
data:
  BIND_ADDRESS: '0.0.0.0'
  DATABASE_SSL: {{ .Values.databaseSSL | quote }}
  ENVIRONMENT: {{ .Values.environment | quote }}
  PUBLIC_ORIGIN: {{ required "publicOrigin is required" .Values.publicOrigin | quote }}
  PREVIEW_MODE: 'true'
  EMAIL_MODE: disabled
  MEDIA_DRIVER: {{ .Values.media.driver | quote }}
  MEDIA_ROOT: /data/media
  TRUSTED_PROXY_CIDRS: {{ .Values.backend.trustedProxyCIDRs | quote }}
  AWS_REGION: {{ .Values.media.region | quote }}
  S3_BUCKET: {{ .Values.media.bucket | quote }}
  S3_ENDPOINT: {{ .Values.media.endpoint | quote }}
---
apiVersion: v1
kind: Service
metadata: { name: backend, labels: { app: backend } }
spec:
  type: ClusterIP
  selector: { app: backend }
  ports: [{ name: http, port: 3000, targetPort: http }]
---
apiVersion: v1
kind: Service
metadata: { name: frontend }
spec:
  type: ClusterIP
  selector: { app: frontend }
  ports: [{ name: http, port: 8080, targetPort: http }]
---
{{ range $name := list "backend" "frontend" }}
{{ $component := index $.Values $name }}
apiVersion: apps/v1
kind: Deployment
metadata: { name: {{ $name }} }
spec:
  replicas: {{ $component.replicas }}
  revisionHistoryLimit: 3
  strategy:
    type: RollingUpdate
    rollingUpdate: { maxSurge: 0, maxUnavailable: 1 }
  selector:
    matchLabels: { app: {{ $name }} }
  template:
    metadata:
      labels: { app: {{ $name }} }
    spec:
      automountServiceAccountToken: false
      terminationGracePeriodSeconds: 20
      securityContext:
        runAsNonRoot: true
        runAsUser: {{ if eq $name "backend" }}1000{{ else }}101{{ end }}
        runAsGroup: {{ if eq $name "backend" }}1000{{ else }}101{{ end }}
        fsGroup: {{ if eq $name "backend" }}1000{{ else }}101{{ end }}
        seccompProfile: { type: RuntimeDefault }
      containers:
        - name: {{ $name }}
          image: "{{ $component.image.repository }}:{{ $component.image.tag }}"
          imagePullPolicy: {{ $component.image.pullPolicy }}
          ports: [{ name: http, containerPort: {{ if eq $name "backend" }}3000{{ else }}8080{{ end }} }]
          resources: {{ toYaml $component.resources | nindent 12 }}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: { drop: [ALL] }
          livenessProbe:
            httpGet: { path: /health/live, port: http }
            initialDelaySeconds: 15
            periodSeconds: 10
          readinessProbe:
            httpGet: { path: {{ if eq $name "backend" }}/health/ready{{ else }}/health/live{{ end }}, port: http }
            initialDelaySeconds: 5
            periodSeconds: 5
          {{- if eq $name "backend" }}
          envFrom:
            - configMapRef: { name: happy-furn-config }
            - secretRef: { name: {{ $.Values.existingSecret }} }
          {{- end }}
          volumeMounts:
            - { name: tmp, mountPath: /tmp }
            {{- if and (eq $name "backend") (eq $.Values.media.driver "filesystem") }}
            - { name: media, mountPath: /data/media }
            {{- end }}
      volumes:
        - name: tmp
          emptyDir: { sizeLimit: 64Mi }
        {{- if and (eq $name "backend") (eq $.Values.media.driver "filesystem") }}
        - name: media
          persistentVolumeClaim: { claimName: happy-furn-media }
        {{- end }}
---
{{ end }}
{{ if eq .Values.media.driver "filesystem" }}
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: happy-furn-media
  annotations: { helm.sh/resource-policy: keep }
spec:
  accessModes: [ReadWriteOnce]
  {{- if .Values.media.storageClass }}
  storageClassName: {{ .Values.media.storageClass | quote }}
  {{- end }}
  resources: { requests: { storage: {{ .Values.media.size }} } }
{{ end }}
